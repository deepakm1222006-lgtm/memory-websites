    <script>

        const collegeStart =
            new Date(
                "September 1, 2026 09:00:00"
            ).getTime();

        const daysEl = document.getElementById("days");
        const hoursEl = document.getElementById("hours");
        const minutesEl = document.getElementById("minutes");
        const secondsEl = document.getElementById("seconds");
        const messageEl = document.getElementById("countdownMessage");

        if (daysEl && hoursEl && minutesEl && secondsEl && messageEl) {
            function updateCountdown() {
                const now = new Date().getTime();
                const difference = collegeStart - now;

                if (difference <= 0) {
                    daysEl.textContent = "00";
                    hoursEl.textContent = "00";
                    minutesEl.textContent = "00";
                    secondsEl.textContent = "00";
                    messageEl.textContent = "🎒 The new chapter has begun!";
                    return;
                }

                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                daysEl.textContent = String(days).padStart(2, "0");
                hoursEl.textContent = String(hours).padStart(2, "0");
                minutesEl.textContent = String(minutes).padStart(2, "0");
                secondsEl.textContent = String(seconds).padStart(2, "0");
                messageEl.textContent = "Getting closer... 🚀";
            }

            updateCountdown();
            setInterval(updateCountdown, 1000);
        }

        const checkpointButton =
            document.getElementById(
                "checkpointBtn"
            );

        const checkpointStatus =
            document.getElementById(
                "checkpointStatus"
            );

        if (checkpointButton && checkpointStatus) {
            checkpointButton.addEventListener(
                "click",
                function () {
                    localStorage.setItem(
                        "chapterMarked",
                        "true"
                    );

                    checkpointStatus.textContent =
                        "✅ Chapter marked! Come back later and see how far you've travelled.";

                    checkpointButton.textContent =
                        "✓ Chapter Saved";

                    checkpointButton.disabled =
                        true;
                }
            );

            if (
                localStorage.getItem(
                    "chapterMarked"
                ) === "true"
            ) {
                checkpointButton.textContent =
                    "✓ Chapter Saved";

                checkpointButton.disabled =
                    true;

                checkpointStatus.textContent =
                    "Your chapter is already marked. 🌱";
            }
        }

    </script>
